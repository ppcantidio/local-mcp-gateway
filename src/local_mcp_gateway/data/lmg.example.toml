# Copy to lmg.toml (`lmg init`) or ~/.config/lmg/config.toml.
# API keys never go in this file — export LMG_API_KEY instead.

listen = "127.0.0.1:8788"

[auth]
header = "authorization"
prefix = "Bearer "

[publisher]
name = "local"              # local | tailscale | cloudflare | ngrok
mode = "funnel"             # tailscale only: serve | funnel

# Reliability knobs for Cloud Agents + public tunnels.
# Keep GET SSE enabled (Cursor Cloud needs it). Heartbeats mitigate Funnel idle drops.
[proxy]
# disable_get_sse = false
sse_heartbeat_seconds = 15
upstream_retries = 2

[[mcp]]
name = "paper"
url = "http://127.0.0.1:29979"
rewrite_host = "127.0.0.1:29979"
